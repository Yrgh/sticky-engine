[package]
name = "sticky-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Game engine based on composition and trees"
repository = "https://github.com/Yrgh/sticky-engine"
keywords = ["engine", "game", "gamedev", "component", "composition"]
categories = ["game-development", "game-engines", "rendering", "rendering::engine"]

[workspace]
members = ["macros"]

[features]
default = ["vulkan-renderer", "simple-asset-impls"]

gpu-vulkan = ["dep:vulkano"]
vulkan-renderer = ["gpu-vulkan"]

simple-asset-impls = []

serde = ["dep:serde"]
wincode = ["dep:wincode"]
ron = ["dep:ron", "serde"]

rapier3d = ["dep:rapier3d"]

[dependencies]
rapier3d = { version = "0.34.0", optional = true }
vulkano = { version = "0.35.2", optional = true }
winit = "0.30.13"
sticky-engine-macros = { path = "macros" }
anyhow = "1.0.104"
linkme = "0.3.37"
elsa = "1.11.2"
boxcar = "0.2.14"
glamx = "0.3.0"
smallvec = "1.15.2"
thiserror = "2.0.20"
tracing = "0.1.44"
futures = "0.3.34"
event-listener = "5.4.2"
parking_lot = "0.12.5"
wincode = { version = "0.6.1", optional = true }
ron = { version = "0.12.2", optional = true }
serde = { version = "1.0.229", optional = true }
gilrs = "0.11.2"

[dev-dependencies]
tracing-subscriber = "0.3.23"
