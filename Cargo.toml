[package]
name = "sticky-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Game engine based on composition and trees"
repository = "https://github.com/Yrgh/sticky-engine"
keywords = ["engine", "game", "gamedev", "component", "composition"]
categories = ["game-development", "game-engines", "rendering", "rendering::engine"]

[workspace]
members = ["macros"]

[features]
default = ["vulkan-renderer"]
gpu-vulkan = ["dep:vulkano"]
vulkan-renderer = ["gpu-vulkan"]

[dependencies]
rapier3d = "0.34.0"
vulkano = {version="0.35.2", optional=true}
winit = "0.30.13"
sticky-engine-macros = {path="macros"}
anyhow = "1.0.104"
linkme = "0.3.37"
elsa = "1.11.2"
boxcar = "0.2.14"
glamx = "0.3.0"
smallvec = "1.15.2"
thiserror = "2.0.20"
tracing = "0.1.44"
futures = "0.3.34"

[dev-dependencies]
tracing-subscriber = "0.3.23"
